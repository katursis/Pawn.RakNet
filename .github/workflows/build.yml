name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
      - "*/*"
      - "**"
  pull_request:
    branches:
      - "*"
      - "*/*"
      - "**"
env:
  PLUGIN_VERSION: 1.6.1-omp

jobs:
  build-windows-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.5
        with:
          cmakeVersion: "3.23.2"

      - name: Generate build files
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Stage artifact
        run: |
          New-Item -ItemType Directory -Path artifact
          Copy-Item build/Release/pawnraknet.dll, src/Pawn.RakNet.inc -Destination artifact

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pawnraknet-${{ env.PLUGIN_VERSION }}-win32
          path: artifact/
          if-no-files-found: error

  build-linux-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib

      - name: Install CMake
        uses: lukka/get-cmake@v4.4.5
        with:
          cmakeVersion: "3.23.2"

      - name: Generate build files
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32

      - name: Build
        run: cmake --build build --config Release

      - name: Create artifact
        run: tar -czf pawnraknet-$PLUGIN_VERSION-linux.tar.gz -C build pawnraknet.so -C ../src Pawn.RakNet.inc

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pawnraknet-${{ env.PLUGIN_VERSION }}-linux
          path: pawnraknet-${{ env.PLUGIN_VERSION }}-linux.tar.gz
          if-no-files-found: error
